name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Version
        run: zig version
      - name: Format
        run: zig fmt --check build.zig src
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Run semantic demo
        run: zig build run
